[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aa-hmi"
version = "0.2.0"
description = "Generic display-server daemon for an AA-Wireless-style Bluetooth head unit -- bootstrap, hold the video session, and bridge frames/touch to any local program"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "aa-hmi contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pillow"]
examples = ["pillow"]

[project.scripts]
aa-hmi = "aa_hmi.cli:main"

[project.urls]
Homepage = "https://github.com/Plek324/aa-hmi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
